<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="dsh-ascii-sharks">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d2a44"/>
      <stop offset="55%" stop-color="#0a1b2f"/>
      <stop offset="100%" stop-color="#04080f"/>
    </linearGradient>
    <linearGradient id="fin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9fdcf5"/>
      <stop offset="100%" stop-color="#4aa3cf"/>
    </linearGradient>
  </defs>

  <rect width="96" height="96" rx="22" fill="url(#sea)"/>

  <!-- water grid -->
  <g stroke="#8fd8f2" stroke-opacity="0.10" stroke-width="1">
    <path d="M0 24H96M0 48H96M0 72H96M24 0V96M48 0V96M72 0V96"/>
  </g>

  <!-- dorsal fin -->
  <path d="M46 20 L60 44 L34 44 Z" fill="url(#fin)"/>

  <!-- body -->
  <path d="M18 56 C30 44 58 44 70 54 C74 57 76 60 78 63 C74 62 71 63 68 65 C58 74 30 74 18 62 Z"
        fill="#dff2fb" fill-opacity="0.92"/>
  <!-- tail -->
  <path d="M18 56 L8 46 L10 59 L8 72 Z" fill="#bfe6f7" fill-opacity="0.85"/>
  <!-- eye -->
  <circle cx="30" cy="57" r="2.4" fill="#08131f"/>
  <!-- gills -->
  <g stroke="#6fb4d6" stroke-width="1.6" stroke-linecap="round" opacity="0.75">
    <path d="M40 52v10M46 52v10M52 52v10"/>
  </g>

  <!-- bubbles -->
  <g fill="#cfeeff" fill-opacity="0.55">
    <circle cx="80" cy="34" r="2.2"/>
    <circle cx="84" cy="26" r="1.4"/>
    <circle cx="76" cy="24" r="1.1"/>
  </g>
</svg>
